<!DOCTYPE html>

<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Caudal Ledger - Crear Cuenta</title>
<!-- Tailwind CSS CDN with forms and container-queries -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration -->
<script data-purpose="tailwind-config">
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            caudal: {
              50: '#eff6ff',
              100: '#dbeafe',
              200: '#bfdbfe',
              500: '#1d72fe',
              600: '#0e6fff',
              700: '#0052e0',
              dark: '#0f172a',
              muted: '#64748b'
            }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif']
          },
          boxShadow: {
            'card': '0 20px 45px -15px rgba(14, 111, 255, 0.08), 0 8px 16px -4px rgba(0, 0, 0, 0.04)',
            'button': '0 8px 20px -2px rgba(14, 111, 255, 0.38)'
          }
        }
      }
    };
  </script>
<!-- Base Custom Styles -->
<style data-purpose="custom-layout">
    body {
      background-color: #f7f9fd;
      background-image: 
        radial-gradient(at 0% 0%, rgba(219, 234, 254, 0.45) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(224, 231, 255, 0.3) 0px, transparent 50%);
      min-height: 100vh;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body class="font-sans antialiased text-slate-800 flex flex-col justify-center items-center p-4 sm:py-10">
<!-- BEGIN: MobileDeviceContainer -->
<!-- Constrained precisely to mobile 390px layout viewport -->
<main class="w-full max-w-[390px] flex flex-col items-center mx-auto" data-purpose="mobile-registration-view">
<!-- BEGIN: HeaderSection -->
<header class="w-full flex flex-col items-center text-center mt-3 mb-6" data-purpose="screen-header">
<!-- Status Badge Pill -->
<div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-blue-50/80 border border-blue-100/90 text-xs font-medium text-slate-600 shadow-sm mb-4">
<span class="h-2 w-2 rounded-full bg-blue-600 inline-block animate-pulse"></span>
<span>v2.4.0 • SPC-003</span>
</div>
<!-- App Logo -->
<div class="flex items-center justify-center gap-3 mb-2">
<div class="w-11 h-11 rounded-2xl bg-blue-600 flex items-center justify-center text-white shadow-md shadow-blue-500/25">
<!-- Caudal 'C' brand icon -->
<svg class="w-6 h-6 fill-current" viewbox="0 0 24 24">
<path d="M12 2C6.477 2 2 6.477 2 12s4.477 10 10 10c3.82 0 7.14-2.14 8.84-5.3a1.25 1.25 0 10-2.2-1.18C17.33 18.06 14.83 19.5 12 19.5c-4.14 0-7.5-3.36-7.5-7.5S7.86 4.5 12 4.5c2.83 0 5.33 1.44 6.64 3.98a1.25 1.25 0 002.2-1.18C19.14 4.14 15.82 2 12 2z"></path>
</svg>
</div>
<h1 class="text-2xl font-bold tracking-tight text-slate-900">
          Caudal <span class="text-blue-600">Ledger</span>
</h1>
</div>
<!-- Slogan -->
<p class="text-xs text-slate-500 max-w-[280px]">
        Control patrimonial y multimoneda sin fricción
      </p>
</header>
<!-- END: HeaderSection -->
<!-- BEGIN: RegisterCard -->
<div class="w-full bg-white/95 backdrop-blur-md rounded-3xl p-6 border border-slate-100/90 shadow-card flex flex-col gap-5" data-purpose="registration-card">
<!-- Switch Tabs (Entrar / Registrarse) -->
<div class="bg-slate-100/80 p-1 rounded-xl flex items-center text-xs font-semibold" data-purpose="auth-tabs">
<a class="flex-1 text-center py-2 rounded-lg text-slate-500 hover:text-slate-700 transition" href="#login">
          Entrar
        </a>
<div class="flex-1 text-center py-2 rounded-lg bg-white text-slate-900 shadow-sm border border-slate-200/50">
          Registrarse
        </div>
</div>
<!-- Social Register Button -->
<button class="w-full flex items-center justify-center gap-2.5 py-3 px-4 rounded-xl border border-slate-200 bg-white hover:bg-slate-50 active:scale-[0.98] transition font-medium text-xs text-slate-700 shadow-sm" data-purpose="google-signup-button" type="button">
<!-- Google Logo SVG -->
<svg class="w-4 h-4" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"></path>
</svg>
<span>Registrarse con Google</span>
</button>
<!-- Separator -->
<div class="relative flex items-center justify-center my-1" data-purpose="separator">
<div class="border-t border-slate-200 w-full"></div>
<span class="bg-white px-3 text-[10px] tracking-wider uppercase font-semibold text-slate-400 absolute">O con tu correo</span>
</div>
<!-- Registration Form -->
<form class="flex flex-col gap-4" data-purpose="registration-form" onsubmit="event.preventDefault();">
<!-- Field: Full Name -->
<div class="space-y-1">
<label class="block text-xs font-semibold text-slate-700" for="full-name">Nombre completo</label>
<div class="relative rounded-xl shadow-sm">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.8" viewbox="0 0 24 24">
<path d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<input class="w-full text-xs pl-9 pr-3 py-2.5 bg-slate-50/50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-slate-800 placeholder-slate-400 transition" id="full-name" name="name" placeholder="Carlos Mendoza" required="" type="text" value="Carlos Mendoza"/>
</div>
</div>
<!-- Field: Email -->
<div class="space-y-1">
<label class="block text-xs font-semibold text-slate-700" for="email">Correo electrónico</label>
<div class="relative rounded-xl shadow-sm">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.8" viewbox="0 0 24 24">
<path d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<input class="w-full text-xs pl-9 pr-3 py-2.5 bg-slate-50/50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-slate-800 placeholder-slate-400 transition" id="email" name="email" placeholder="carlos@ejemplo.com" required="" type="email" value="carlos@ejemplo.com"/>
</div>
</div>
<!-- Field: Password -->
<div class="space-y-1">
<label class="block text-xs font-semibold text-slate-700" for="password">Contraseña</label>
<div class="relative rounded-xl shadow-sm">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.8" viewbox="0 0 24 24">
<path d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<input class="w-full text-xs pl-9 pr-10 py-2.5 bg-slate-50/50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-slate-800 tracking-wider transition" id="password" name="password" required="" type="password" value="PatrimonioSeguro2025!"/>
<!-- Toggle Visibility Icon -->
<button aria-label="Mostrar contraseña" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600 focus:outline-none" type="button">
<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.8" viewbox="0 0 24 24">
<path d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
<!-- Password Strength Indicator -->
<div class="pt-1.5 flex items-center justify-between gap-2" data-purpose="password-meter">
<div class="flex-1 flex gap-1">
<span class="h-1 flex-1 bg-emerald-500 rounded-full"></span>
<span class="h-1 flex-1 bg-emerald-500 rounded-full"></span>
<span class="h-1 flex-1 bg-emerald-500 rounded-full"></span>
</div>
<span class="text-[10px] font-medium text-emerald-600">Seguridad: Fuerte</span>
</div>
</div>
<!-- Field: Primary Currency Selector -->
<div class="space-y-1.5 pt-1" data-purpose="currency-selection">
<label class="block text-xs font-semibold text-slate-700">Moneda principal de trabajo</label>
<div class="grid grid-cols-2 gap-2">
<!-- BOB Option (Selected) -->
<label class="flex items-center justify-between p-2 rounded-xl border-2 border-blue-600 bg-blue-50/40 cursor-pointer">
<div class="flex items-center gap-1.5">
<input checked="" class="text-blue-600 focus:ring-blue-500 h-3.5 w-3.5 border-slate-300" name="currency" type="radio" value="BOB"/>
<span class="text-xs font-bold text-slate-900">BOB</span>
</div>
<span class="text-[10px] text-slate-500">Bolivianos</span>
</label>
<!-- USD Option -->
<label class="flex items-center justify-between p-2 rounded-xl border border-slate-200 bg-white hover:bg-slate-50 cursor-pointer">
<div class="flex items-center gap-1.5">
<input class="text-blue-600 focus:ring-blue-500 h-3.5 w-3.5 border-slate-300" name="currency" type="radio" value="USD"/>
<span class="text-xs font-bold text-slate-800">USD</span>
</div>
<span class="text-[10px] text-slate-500">Dólar</span>
</label>
</div>
</div>
<!-- Terms and Conditions Checkbox -->
<div class="pt-1 flex items-start gap-2" data-purpose="terms-agreement">
<input checked="" class="h-4 w-4 mt-0.5 rounded border-slate-300 text-blue-600 focus:ring-blue-500 transition" id="terms" name="terms" type="checkbox"/>
<label class="text-[11px] text-slate-500 leading-tight" for="terms">
            Acepto los <a class="text-blue-600 hover:underline" href="#terms">Términos de Servicio</a> y la <a class="text-blue-600 hover:underline" href="#privacy">Política de Privacidad</a> de Caudal.
          </label>
</div>
<!-- Main Submit CTA Button -->
<button class="w-full mt-2 bg-blue-600 hover:bg-blue-700 active:scale-[0.99] text-white font-semibold py-3 px-4 rounded-xl shadow-button flex items-center justify-center gap-2 text-xs transition duration-150 ease-in-out" data-purpose="submit-button" type="submit">
<span>Crear cuenta en Caudal</span>
<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</form>
</div>
<!-- END: RegisterCard -->
<!-- BEGIN: FooterLinks -->
<div class="w-full flex flex-col items-center mt-5 mb-3 text-center gap-4" data-purpose="footer-section">
<!-- Existing Account Prompt -->
<p class="text-xs text-slate-500">
        ¿Ya tienes una cuenta? 
        <a class="font-semibold text-blue-600 hover:text-blue-700 hover:underline ml-0.5" href="#login">Iniciar sesión</a>
</p>
<!-- Trust & Security Banner -->
<div class="w-full p-3 bg-blue-50/60 border border-blue-100/80 rounded-2xl flex items-center justify-center gap-2.5 text-slate-600 text-[11px]" data-purpose="trust-badge">
<div class="flex-shrink-0 text-emerald-600">
<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<p class="text-left text-[10px] text-slate-600 leading-snug">
          Tus datos financieros se almacenan con cifrado local seguro • Multimoneda BOB / USD • Principio de partida doble
        </p>
</div>
</div>
<!-- END: FooterLinks -->
</main>
<!-- END: MobileDeviceContainer -->
</body></html>
