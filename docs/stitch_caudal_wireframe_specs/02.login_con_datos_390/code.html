<!DOCTYPE html>

<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Acceso y Autenticación — Caudal Ledger</title>
<!-- Tailwind CSS v3 con plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              DEFAULT: '#0E6FFF',
              hover: '#095ad6',
              light: '#EBF3FF',
              dark: '#0A4EB5'
            },
            frost: '#F6F8FC'
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Text"', '"SF Pro Display"', 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', 'sans-serif']
          }
        }
      }
    }
  </script>
<!-- Estilos personalizados para el layout del dispositivo móvil iOS -->
<style data-purpose="layout">
    body {
      background-color: #F6F8FC;
      color: #0F172A;
      -webkit-tap-highlight-color: transparent;
    }
    .mobile-container {
      width: 100%;
      max-width: 390px;
      min-height: 100vh;
      margin-left: auto;
      margin-right: auto;
    }
  </style>
</head>
<body class="bg-frost antialiased font-sans flex flex-col justify-center items-center min-h-screen p-0 sm:py-6">
<!-- BEGIN: MobileDeviceContainer -->
<div class="mobile-container flex flex-col justify-between px-5 pt-8 pb-8 relative selection:bg-blue-100 selection:text-brand" data-purpose="mobile-frame">
<!-- BEGIN: HeaderSection -->
<header class="flex flex-col items-center text-center mt-2 mb-6" data-purpose="brand-header">
<!-- Indicador sutil de versión / especificación -->
<div class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-slate-100/90 border border-slate-200/80 mb-5">
<span class="w-1.5 h-1.5 rounded-full bg-brand animate-pulse"></span>
<span class="text-[11px] font-medium tracking-wide text-slate-600">v2.4.0 • SPC-003</span>
</div>
<!-- Logotipo e Isotipo Caudal -->
<div class="flex items-center gap-2.5 mb-2">
<div class="w-10 h-10 rounded-2xl bg-brand flex items-center justify-center shadow-md shadow-brand/25 overflow-hidden">
<!-- Logo oficial provisto -->
<img alt="Logo Caudal" class="w-7 h-7 object-contain" src="https://lh3.googleusercontent.com/aida/AEtjO1XuS0l__I8kNnPs9zIHYFFNeNzURjCyYUpazQjkhdZlF_ciY_l4txIYvAGlHD7BnMTRqL5ejDxNT4lmWmvpPnu0tvUO4ZTMn41YkOvQFeK__t_yDvFWZ0dH5EAeiqSIOoRISwEXegTwgGTZ8H38MyFOf7Snbw8xkpFZ7xT7JbvFrTvPODx-9F4ABmq1XdJfhlekjjjnOEaQ3169AXXuTrzl0UwF-sMlHnJxiEpf5713vu_LfTUEYBc86JgR"/>
</div>
<h1 class="text-2xl font-bold tracking-tight text-slate-900">
          Caudal <span class="text-brand font-extrabold">Ledger</span>
</h1>
</div>
<!-- Subtítulo de propuesta de valor -->
<p class="text-xs sm:text-sm text-slate-500 max-w-[270px] leading-relaxed">
        Control patrimonial y multimoneda sin fricción
      </p>
</header>
<!-- END: HeaderSection -->
<!-- BEGIN: FormCard -->
<main class="w-full bg-white rounded-[24px] p-6 shadow-sm border border-slate-100 flex flex-col gap-5 relative" data-purpose="login-card">
<!-- Selector Tabs: Entrar / Registrarse -->
<div class="grid grid-cols-2 p-1 bg-slate-100/80 rounded-xl border border-slate-200/60" data-purpose="auth-tabs">
<button class="py-2 text-xs font-semibold text-slate-900 bg-white rounded-lg shadow-sm transition-all text-center" type="button">
          Entrar
        </button>
<button class="py-2 text-xs font-medium text-slate-500 hover:text-slate-900 rounded-lg transition-all text-center" type="button">
          Registrarse
        </button>
</div>
<!-- Botón Autenticación Social (Google SPC-023) -->
<button class="w-full h-12 rounded-full border border-slate-200/90 bg-white hover:bg-slate-50 active:bg-slate-100 flex items-center justify-center gap-3 text-sm font-medium text-slate-700 transition-colors shadow-none" data-purpose="google-oauth-button" type="button">
<svg class="w-4 h-4" viewbox="0 0 24 24">
<path d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.8-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z" fill="#4285F4"></path>
<path d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.24v3.15C3.26 21.36 7.33 24 12 24z" fill="#34A853"></path>
<path d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.24C.45 8.16 0 9.97 0 12s.45 3.84 1.24 5.42l4.04-3.15z" fill="#FBBC05"></path>
<path d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.24 6.58l4.04 3.15c.95-2.83 3.6-4.98 6.72-4.98z" fill="#EA4335"></path>
</svg>
<span>Continuar con Google</span>
</button>
<!-- Divisor con etiqueta -->
<div class="relative flex items-center justify-center my-0.5">
<div class="border-t border-slate-200/80 w-full"></div>
<span class="bg-white px-3 text-[11px] font-medium tracking-wide uppercase text-slate-400 absolute">o con tu correo</span>
</div>
<!-- Formulario de Credenciales -->
<form class="space-y-4" data-purpose="credentials-form" onsubmit="event.preventDefault();">
<!-- Campo Correo Electrónico -->
<div class="space-y-1.5">
<label class="block text-xs font-semibold text-slate-700" for="email">
            Correo electrónico
          </label>
<div class="relative flex items-center">
<span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
<!-- Icono Mail -->
<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.8" viewbox="0 0 24 24">
<path d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</span>
<input class="w-full pl-10 pr-4 py-2.5 bg-slate-50/50 hover:bg-slate-50 focus:bg-white text-sm text-slate-900 placeholder:text-slate-400 rounded-xl border border-slate-200 focus:border-brand focus:ring-1 focus:ring-brand outline-none transition-all" id="email" name="email" placeholder="tu@ejemplo.com" required="" type="email"/>
</div>
</div>
<!-- Campo Contraseña -->
<div class="space-y-1.5">
<div class="flex items-center justify-between">
<label class="block text-xs font-semibold text-slate-700" for="password">
              Contraseña
            </label>
<a class="text-[11px] font-medium text-brand hover:text-brand-dark transition-colors" href="#">
              ¿Olvidaste tu contraseña?
            </a>
</div>
<div class="relative flex items-center">
<span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
<!-- Icono Lock -->
<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.8" viewbox="0 0 24 24">
<path d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</span>
<input class="w-full pl-10 pr-10 py-2.5 bg-slate-50/50 hover:bg-slate-50 focus:bg-white text-sm text-slate-900 placeholder:text-slate-400 rounded-xl border border-slate-200 focus:border-brand focus:ring-1 focus:ring-brand outline-none transition-all" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<!-- Botón para alternar visibilidad de contraseña -->
<button aria-label="Mostrar contraseña" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600 focus:outline-none" id="togglePassword" type="button">
<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.8" viewbox="0 0 24 24">
<path d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
</div>
<!-- Botón CTA de Envío -->
<div class="pt-2">
<button class="w-full h-12 bg-brand hover:bg-brand-hover active:bg-brand-dark text-white font-semibold text-sm rounded-full shadow-md shadow-brand/20 transition-all flex items-center justify-center gap-2" type="submit">
<span>Entrar a Caudal</span>
<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
</form>
</main>
<!-- END: FormCard -->
<!-- BEGIN: FooterSection -->
<footer class="flex flex-col items-center text-center mt-6 gap-4" data-purpose="screen-footer">
<!-- Alternativa de registro -->
<p class="text-xs text-slate-600">
        ¿No tienes una cuenta? 
        <a class="font-semibold text-brand hover:text-brand-dark underline underline-offset-2 ml-1" href="#">
          Crear cuenta nueva
        </a>
</p>
<!-- Badge / Micro-aviso de Seguridad y Multimoneda -->
<div class="flex items-center gap-1.5 px-3 py-2 rounded-xl bg-slate-200/50 border border-slate-200 text-slate-500 text-[10px] leading-tight text-center max-w-[320px]">
<svg class="w-3.5 h-3.5 flex-shrink-0 text-emerald-600" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span>Tus datos financieros se almacenan con cifrado local seguro • Multimoneda BOB / USD</span>
</div>
</footer>
<!-- END: FooterSection -->
</div>
<!-- END: MobileDeviceContainer -->
<!-- BEGIN: InteractiveScripts -->
<script data-purpose="toggle-password-visibility">
    // Control básico para mostrar/ocultar contraseña
    const togglePasswordBtn = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');

    if (togglePasswordBtn && passwordInput) {
      togglePasswordBtn.addEventListener('click', () => {
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);
      });
    }
  </script>
<!-- END: InteractiveScripts -->
</body></html>
