name: Build & Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: build-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Tests
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      - name: Build con preset node-server
        env:
          NITRO_PRESET: node-server
        run: pnpm build

      - name: Empaquetar .output
        run: tar -czf caudal-output.tar.gz .output ecosystem.config.cjs

      - name: Subir artifact para deploy
        uses: actions/upload-artifact@v5
        with:
          name: caudal-output
          path: caudal-output.tar.gz
          retention-days: 7

      - name: Definir versión
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(node -p "require('./package.json').version || '0.0.0'")" >> "$GITHUB_OUTPUT"
          fi

      - name: Definir tag de release
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=deploy-$(date +%Y%m%d-%H%M%S)-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Caudal ${{ steps.version.outputs.version }}
          body: |
            Artifact de producción (.output) para deploy en VPS.
            - Commit: ${{ github.sha }}
            - Trigger: ${{ github.event_name }}
          files: caudal-output.tar.gz
          fail_on_unmatched_files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      VPS_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_PASSPHRASE: ${{ secrets.VPS_SSH_KEY_PASSPHRASE }}
    steps:
      - name: Descargar artifact
        uses: actions/download-artifact@v5
        with:
          name: caudal-output
          path: .

      - name: Copiar a la VPS
        if: ${{ env.VPS_HOST != '' && env.VPS_KEY != '' }}
        uses: appleboy/scp-action@v1
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          port: ${{ env.VPS_PORT }}
          key: ${{ env.VPS_KEY }}
          passphrase: ${{ env.VPS_PASSPHRASE }}
          source: caudal-output.tar.gz
          target: /tmp

      - name: Desplegar en la VPS
        if: ${{ env.VPS_HOST != '' && env.VPS_KEY != '' }}
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          port: ${{ env.VPS_PORT }}
          key: ${{ env.VPS_KEY }}
          passphrase: ${{ env.VPS_PASSPHRASE }}
          script: |
            set -e
            test -f /tmp/caudal-output.tar.gz
            rm -rf /var/www/caudal/current/.output
            tar -xzf /tmp/caudal-output.tar.gz -C /var/www/caudal/current
            rm -f /tmp/caudal-output.tar.gz
            cd /var/www/caudal/current && bash -lc 'set -a; . ./.env; set +a; pnpm db:migrate' || true
            pm2 restart caudal --update-env || pm2 start /var/www/caudal/current/ecosystem.config.cjs
            pm2 save
            sleep 3
            curl -sf http://127.0.0.1:3071/api/_health > /dev/null && echo "Health check OK" || { echo "Health check FALLIDO"; exit 1; }
