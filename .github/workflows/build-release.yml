name: Build & Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: build-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://dev:dev@127.0.0.1:5432/caudal_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dev
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: caudal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Migrar BD de tests
        run: pnpm db:migrate

      - name: Tests
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      - name: Build con preset node-server
        env:
          NITRO_PRESET: node-server
        run: pnpm build

      - name: Empaquetar artefacto de deploy
        run: |
          # El deploy no depende de un checkout en la VPS (SPC-041): el runner,
          # las migraciones y deploy.sh viajan dentro del artefacto.
          cp -r server/db/migrations .output/migrations
          cp scripts/migrate.mjs .output/server/migrate.mjs
          # El runner usa el migrator de drizzle-orm, que Nitro no traza porque la
          # app no lo importa: se copia el paquete completo (sin tipos ni mapas).
          cp -rL node_modules/drizzle-orm/. .output/server/node_modules/drizzle-orm/
          find .output/server/node_modules/drizzle-orm \( -name '*.d.ts' -o -name '*.d.cts' -o -name '*.map' \) -delete
          cp scripts/deploy.sh deploy.sh
          tar -czf caudal-output.tar.gz .output ecosystem.config.cjs deploy.sh

      - name: Definir versión
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(node -p "require('./package.json').version || '0.0.0'")" >> "$GITHUB_OUTPUT"
          fi

      - name: Definir tag de release
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=deploy-$(date +%Y%m%d-%H%M%S)-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Caudal ${{ steps.version.outputs.version }}
          body: |
            Artifact de producción (.output) para deploy en VPS.
            - Commit: ${{ github.sha }}
            - Trigger: ${{ github.event_name }}
          files: caudal-output.tar.gz
          fail_on_unmatched_files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      VPS_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_PASSPHRASE: ${{ secrets.VPS_SSH_KEY_PASSPHRASE }}
    steps:
      # Un solo camino de deploy, y autocontenido (SPC-041): la CI baja el
      # artefacto del tag, extrae el deploy.sh que viene en él (no el del repo)
      # y lo ejecuta. Ese script migra desde .output/migrations, cambia el código
      # y verifica el health check; si algo falla, el job queda en rojo.
      - name: Desplegar en la VPS (deploy.sh del release)
        if: ${{ env.VPS_HOST != '' && env.VPS_KEY != '' }}
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          port: ${{ env.VPS_PORT }}
          key: ${{ env.VPS_KEY }}
          passphrase: ${{ env.VPS_PASSPHRASE }}
          script: |
            set -e
            TAG="${{ needs.build.outputs.tag }}"
            TMP="/tmp/caudal-bootstrap-$TAG"
            rm -rf "$TMP" && mkdir -p "$TMP"
            gh release download "$TAG" --repo ErwinFloresMarca/caudal --pattern caudal-output.tar.gz --clobber --dir "$TMP"
            tar -xzf "$TMP/caudal-output.tar.gz" -C "$TMP" deploy.sh
            bash "$TMP/deploy.sh" "$TAG"
