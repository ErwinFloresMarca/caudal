name: Build & Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: build-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://dev:dev@127.0.0.1:5432/caudal_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dev
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: caudal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Migrar BD de tests
        run: pnpm db:migrate

      - name: Tests
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      - name: Build con preset node-server
        env:
          NITRO_PRESET: node-server
        run: pnpm build

      - name: Empaquetar .output
        run: tar -czf caudal-output.tar.gz .output ecosystem.config.cjs

      - name: Definir versión
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(node -p "require('./package.json').version || '0.0.0'")" >> "$GITHUB_OUTPUT"
          fi

      - name: Definir tag de release
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=deploy-$(date +%Y%m%d-%H%M%S)-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Caudal ${{ steps.version.outputs.version }}
          body: |
            Artifact de producción (.output) para deploy en VPS.
            - Commit: ${{ github.sha }}
            - Trigger: ${{ github.event_name }}
          files: caudal-output.tar.gz
          fail_on_unmatched_files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      VPS_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_PASSPHRASE: ${{ secrets.VPS_SSH_KEY_PASSPHRASE }}
    steps:
      # Un solo camino de deploy: el mismo script que se ejecuta a mano. Él
      # descarga el release del tag, migra desde el checkout del repo y reinicia
      # pm2; si la migración falla, el script aborta y este job queda en rojo.
      - name: Desplegar en la VPS (deploy.sh)
        if: ${{ env.VPS_HOST != '' && env.VPS_KEY != '' }}
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          port: ${{ env.VPS_PORT }}
          key: ${{ env.VPS_KEY }}
          passphrase: ${{ env.VPS_PASSPHRASE }}
          script: |
            set -e
            # El script vive en el repo (SPC-032); la ruta del checkout debe coincidir
            # con CAUDAL_REPO_DIR, que deploy.sh valida antes de migrar.
            bash /root/apps/opencode-workdir/caudal/scripts/deploy.sh "${{ needs.build.outputs.tag }}"
